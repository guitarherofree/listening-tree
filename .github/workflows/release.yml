# Builds a tagged version on GitHub's macOS runners and publishes it as a
# GitHub release. Started by `scripts/release.sh <version> --ci`, or by hand
# from the Actions tab (Release > Run workflow) after pushing the tag.
#
# Private repositories pay for macOS runner time at 10x the Linux rate
# (the free plan includes roughly 200 macOS minutes a month), so this only runs
# when asked. `scripts/release.sh <version>` (the default) builds on your Mac instead.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v0.2.0 (push it first)
        required: true
      arch:
        description: Which Macs to build for
        type: choice
        options: [arm64, universal]
        default: arm64
      draft:
        description: Create the release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check that the tag matches VERSION
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(tr -d ' \n' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::VERSION says $version but the tag is $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-macos
        with:
          arch: ${{ inputs.arch }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          . config/app.env
          flags=(--title "$APP_NAME $VERSION" --notes-file "dist/release-notes-$VERSION.md" --verify-tag)
          if [ "$DRAFT" = true ]; then flags+=(--draft); fi
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.dmg dist/*.dmg.sha256 "${flags[@]}"

      - name: Keep the disk image if publishing failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: listening-tree-${{ inputs.tag }}-${{ inputs.arch }}
          path: dist/*.dmg*
          retention-days: 7
