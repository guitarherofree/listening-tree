# A test build on GitHub's macOS runners without publishing anything.
# The disk image is attached to the run for a week. Run it from the Actions tab.
# (See the note in release.yml about macOS minutes on private repositories.)

name: Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which Macs to build for
        type: choice
        options: [arm64, universal]
        default: arm64
      preview:
        description: Also start the app and attach a screenshot and its startup log (to check UI changes)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-macos
        with:
          arch: ${{ inputs.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: listening-tree-${{ github.sha }}-${{ inputs.arch }}
          path: dist/*.dmg*
          retention-days: 7

      - name: Start the app and take a screenshot
        if: ${{ inputs.preview }}
        shell: bash
        run: |
          set -u
          mkdir -p preview
          app="$(find work -maxdepth 2 -path "work/install-release-*" -name "*.app" | head -1)"
          bundle_id="$(defaults read "$PWD/$app/Contents/Info" CFBundleIdentifier)"

          # The recording meter opens the input at startup, which makes macOS ask for the
          # microphone; allow it up front so the question doesn't cover (or hold up) the window
          now="$(date +%s)"
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            if sudo sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceMicrophone','$bundle_id',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);"; then
              echo "Microphone allowed in $db"
            else
              echo "Could not write $db"
            fi
          done

          echo "Starting $app ($bundle_id)"
          open "$app"
          sleep 20
          # If macOS still asks, answer it
          for proc in UserNotificationCenter universalAccessAuthWarn tccd SecurityAgent; do
            osascript -e "tell application \"System Events\" to click button \"Allow\" of window 1 of process \"$proc\"" 2>/dev/null && echo "Clicked Allow ($proc)"
          done
          # First-start question about plugins (only on a fresh machine)
          osascript -e 'tell application "System Events" to tell process "audacity" to click button "Skip this time" of window 1' 2>/dev/null && echo "Skipped plugin validation"
          open "$app"
          sleep 25
          screencapture -x preview/screen.png || echo "screencapture failed"
          sleep 10
          screencapture -x preview/screen-later.png || true
          logs="$HOME/Library/Application Support/ListeningTree/ListeningTree/logs"
          cp "$logs"/*.log preview/ 2>/dev/null || echo "no logs in $logs"
          ls -la preview
          pkill -f "$app/Contents/MacOS" || true

          # Also print them into this log, which (unlike attachments) can be read with gh run view --log
          echo "=== The app log, without shortcut warnings"
          grep -h -v -i "shortcut" preview/*.log | head -300 || true
          for shot in screen screen-later; do
            [ -f "preview/$shot.png" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1800 "preview/$shot.png" --out "preview/$shot.jpg" >/dev/null
            echo "=== BEGIN $shot.jpg base64"
            base64 -i "preview/$shot.jpg" | fold -w 2000
            echo "=== END $shot.jpg base64"
          done

      - name: Attach the preview
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ github.sha }}
          path: preview/
          retention-days: 7
